<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Causal transformer block</title><desc id="desc">A pre-normalized transformer block with causal self-attention, residual addition, feed-forward MLP, and a second residual addition.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#faf5ff"/></linearGradient><filter id="s"><feDropShadow dy="7" stdDeviation="7" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="500" rx="26" fill="url(#bg)"/><text x="600" y="48" text-anchor="middle" font-family="Inter,system-ui" font-size="27" font-weight="750" fill="#0f172a">Inside one causal transformer block</text><text x="600" y="76" text-anchor="middle" font-family="Inter,system-ui" font-size="14" fill="#64748b">Kronecker embeddings do not change any of this</text>
  <g font-family="Inter,system-ui" filter="url(#s)"><rect x="48" y="170" width="120" height="70" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="108" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">input X</text><rect x="225" y="170" width="125" height="70" rx="16" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/><text x="287" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#6b21a8">LayerNorm</text><rect x="415" y="138" width="230" height="134" rx="19" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="530" y="174" text-anchor="middle" font-size="17" font-weight="750" fill="#9a3412">causal self-attention</text><text x="530" y="205" text-anchor="middle" font-size="13" fill="#475569">Q asks · K matches</text><text x="530" y="230" text-anchor="middle" font-size="13" fill="#475569">V carries information</text><text x="530" y="253" text-anchor="middle" font-size="12" fill="#c2410c">future positions masked</text><circle cx="708" cy="205" r="25" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="708" y="213" text-anchor="middle" font-size="24" fill="#334155">+</text><rect x="770" y="170" width="125" height="70" rx="16" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/><text x="832" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#6b21a8">LayerNorm</text><rect x="950" y="155" width="185" height="100" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="1042" y="195" text-anchor="middle" font-size="17" font-weight="750" fill="#166534">MLP</text><text x="1042" y="222" text-anchor="middle" font-size="13" fill="#475569">expand · activate</text><text x="1042" y="243" text-anchor="middle" font-size="13" fill="#475569">contract</text></g>
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"><path d="M170 205H213"/><path d="M352 205H403"/><path d="M647 205H672"/><path d="M734 205H758"/><path d="M897 205H938"/><path d="M1137 205H1165"/><path d="M108 243V332H708V242"/><path d="M708 232V370H1160V230"/></g>
  <g font-family="Inter,system-ui"><text x="405" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">residual shortcut</text><text x="935" y="393" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">second residual shortcut</text><rect x="258" y="425" width="684" height="42" rx="21" fill="#ede9fe"/><text x="600" y="452" text-anchor="middle" font-size="14" fill="#5b21b6">stack this block repeatedly, then map each final vector to vocabulary logits</text></g>
</svg>
