<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Decoder-only language model pipeline</title>
  <desc id="desc">Text becomes token IDs, embeddings, contextual vectors, vocabulary logits, and a next-token probability distribution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="27" font-weight="750" fill="#0f172a">How a decoder-only LLM produces the next token</text>
  <text x="600" y="80" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#64748b">Only the input embedding box changes in the paper</text>
  <g filter="url(#shadow)" font-family="Inter,system-ui,sans-serif">
    <rect x="45" y="145" width="155" height="112" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="122" y="181" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Tokenizer</text><text x="122" y="209" text-anchor="middle" font-size="13" fill="#475569">text → integer IDs</text><text x="122" y="234" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#2563eb">[464, 2746, …]</text>
    <rect x="250" y="132" width="185" height="138" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="3"/>
    <text x="342" y="174" text-anchor="middle" font-size="17" font-weight="750" fill="#155e75">Input embedding</text><text x="342" y="202" text-anchor="middle" font-size="13" fill="#475569">one vector per token</text><text x="342" y="229" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#0891b2">B × T × d_model</text><rect x="276" y="244" width="132" height="5" rx="2.5" fill="#22d3ee"/>
    <rect x="485" y="145" width="190" height="112" rx="18" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <text x="580" y="181" text-anchor="middle" font-size="17" font-weight="700" fill="#6b21a8">Transformer stack</text><text x="580" y="209" text-anchor="middle" font-size="13" fill="#475569">causal attention + MLP</text><text x="580" y="234" text-anchor="middle" font-size="12" fill="#7e22ce">mixes earlier context</text>
    <rect x="725" y="145" width="175" height="112" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="812" y="181" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">Output head</text><text x="812" y="209" text-anchor="middle" font-size="13" fill="#475569">vector → V scores</text><text x="812" y="234" text-anchor="middle" font-size="12" fill="#c2410c">logits</text>
    <rect x="950" y="145" width="205" height="112" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <text x="1052" y="181" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">Softmax + sample</text><text x="1052" y="209" text-anchor="middle" font-size="13" fill="#475569">probability over tokens</text><text x="1052" y="234" text-anchor="middle" font-size="12" fill="#15803d">choose the next ID</text>
  </g>
  <g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"><path d="M202 201H241"/><path d="M437 201H476"/><path d="M677 201H716"/><path d="M902 201H941"/></g>
  <path d="M1053 272C1053 354 122 354 122 270" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="600" y="372" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#475569">append the selected token, then repeat autoregressively</text>
</svg>
