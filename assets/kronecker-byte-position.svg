<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Kronecker byte-position representation for token</title><desc id="desc">The UTF-8 bytes of token activate one cell in each matching position column of a byte-by-position grid, which is flattened and projected.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#ecfeff"/></linearGradient><filter id="s"><feDropShadow dy="7" stdDeviation="7" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="500" rx="26" fill="url(#bg)"/><text x="600" y="48" text-anchor="middle" font-family="Inter,system-ui" font-size="27" font-weight="750" fill="#0f172a">Kronecker codec: byte identity × byte position</text><text x="600" y="76" text-anchor="middle" font-family="Inter,system-ui" font-size="14" fill="#64748b">Example token: “token” → UTF-8 bytes [116, 111, 107, 101, 110]</text>
  <g font-family="Inter,system-ui" filter="url(#s)"><rect x="45" y="170" width="140" height="82" rx="16" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="115" y="202" text-anchor="middle" font-size="14" fill="#475569">token text</text><text x="115" y="232" text-anchor="middle" font-size="21" font-weight="750" fill="#0e7490">token</text>
  <rect x="250" y="112" width="520" height="245" rx="20" fill="#fff" stroke="#67e8f9" stroke-width="2"/><text x="510" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#155e75">sparse 256 × 16 byte-position grid</text>
  <g font-family="ui-monospace,monospace" font-size="12" text-anchor="middle" fill="#475569"><text x="340" y="180">p₁</text><text x="430" y="180">p₂</text><text x="520" y="180">p₃</text><text x="610" y="180">p₄</text><text x="700" y="180">p₅</text>
  <g font-size="11" fill="#64748b"><text x="278" y="221">byte</text><text x="278" y="249">value</text></g>
  <rect x="305" y="195" width="70" height="70" rx="10" fill="#cffafe" stroke="#06b6d4"/><rect x="395" y="195" width="70" height="70" rx="10" fill="#cffafe" stroke="#06b6d4"/><rect x="485" y="195" width="70" height="70" rx="10" fill="#cffafe" stroke="#06b6d4"/><rect x="575" y="195" width="70" height="70" rx="10" fill="#cffafe" stroke="#06b6d4"/><rect x="665" y="195" width="70" height="70" rx="10" fill="#cffafe" stroke="#06b6d4"/>
  <text x="340" y="222" font-size="18" font-weight="700" fill="#0e7490">t</text><text x="340" y="247">116</text><text x="430" y="222" font-size="18" font-weight="700" fill="#0e7490">o</text><text x="430" y="247">111</text><text x="520" y="222" font-size="18" font-weight="700" fill="#0e7490">k</text><text x="520" y="247">107</text><text x="610" y="222" font-size="18" font-weight="700" fill="#0e7490">e</text><text x="610" y="247">101</text><text x="700" y="222" font-size="18" font-weight="700" fill="#0e7490">n</text><text x="700" y="247">110</text></g>
  <text x="510" y="300" text-anchor="middle" font-size="13" fill="#475569">each pair (byte value, position) activates exactly one coordinate</text><text x="510" y="328" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#0891b2">flatten + normalize → κ(b) ∈ ℝ⁴⁰⁹⁶</text>
  <rect x="845" y="151" width="300" height="120" rx="18" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/><text x="995" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#6b21a8">learned projection W_proj</text><text x="995" y="218" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#7e22ce">4096 → d_model</text><text x="995" y="247" text-anchor="middle" font-size="12" fill="#64748b">shared by every token</text></g>
  <path d="M187 211H238" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M772 211H833" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <g font-family="Inter,system-ui"><rect x="235" y="405" width="730" height="55" rx="18" fill="#cffafe"/><text x="600" y="428" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">Built-in prior</text><text x="600" y="449" text-anchor="middle" font-size="13" fill="#334155">tokens sharing the same bytes in the same positions share input features before training</text></g>
</svg>
