<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Raw Kronecker codec cosine similarities</title><desc id="desc">Bar chart showing greater similarity when word pairs share byte values at the same positions.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><linearGradient id="bar" x1="0" x2="1"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
  <rect width="1200" height="500" rx="26" fill="url(#bg)"/><text x="600" y="48" text-anchor="middle" font-family="Inter,system-ui" font-size="27" font-weight="750" fill="#0f172a">Raw codec cosine: shared bytes at shared positions</text><text x="600" y="76" text-anchor="middle" font-family="Inter,system-ui" font-size="14" fill="#64748b">Before learning, spelling structure already creates geometry</text>
  <g font-family="Inter,system-ui" font-size="13"><g fill="#334155" text-anchor="end"><text x="300" y="139">separate ↔ seperate</text><text x="300" y="197">mistake ↔ mistkae</text><text x="300" y="255">run ↔ runs</text><text x="300" y="313">run ↔ Run</text><text x="300" y="371">compute ↔ commute</text><text x="300" y="429">nation ↔ creation</text></g>
  <g fill="#e2e8f0"><rect x="330" y="118" width="620" height="27" rx="8"/><rect x="330" y="176" width="620" height="27" rx="8"/><rect x="330" y="234" width="620" height="27" rx="8"/><rect x="330" y="292" width="620" height="27" rx="8"/><rect x="330" y="350" width="620" height="27" rx="8"/><rect x="330" y="408" width="620" height="27" rx="8"/></g>
  <g fill="url(#bar)"><rect x="330" y="118" width="543" height="27" rx="8"/><rect x="330" y="176" width="443" height="27" rx="8"/><rect x="330" y="234" width="537" height="27" rx="8"/><rect x="330" y="292" width="413" height="27" rx="8"/><rect x="330" y="350" width="531" height="27" rx="8"/></g>
  <g fill="#0f172a" font-family="ui-monospace,monospace"><text x="970" y="139">0.88</text><text x="970" y="197">0.71</text><text x="970" y="255">0.87</text><text x="970" y="313">0.67</text><text x="970" y="371">0.86</text><text x="970" y="429">0.00</text></g></g>
  <line x1="330" y1="456" x2="950" y2="456" stroke="#94a3b8"/><g font-family="Inter,system-ui" font-size="11" fill="#64748b" text-anchor="middle"><text x="330" y="478">0.0</text><text x="640" y="478">0.5</text><text x="950" y="478">1.0</text></g>
</svg>
