<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Normal token embedding lookup</title><desc id="desc">A token ID selects one independently learned row from a vocabulary-sized matrix.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="s"><feDropShadow dy="7" stdDeviation="7" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="460" rx="26" fill="url(#bg)"/><text x="600" y="52" text-anchor="middle" font-family="Inter,system-ui" font-size="27" font-weight="750" fill="#0f172a">Normal embedding: identity selects a learned row</text>
  <g font-family="Inter,system-ui" filter="url(#s)"><rect x="70" y="142" width="155" height="84" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="147" y="177" text-anchor="middle" font-size="14" fill="#475569">token ID</text><text x="147" y="207" text-anchor="middle" font-family="ui-monospace,monospace" font-size="23" font-weight="700" fill="#1d4ed8">2746</text>
  <rect x="330" y="92" width="415" height="275" rx="20" fill="#fff" stroke="#a5b4fc" stroke-width="2"/><text x="537" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">E ∈ ℝ^(V × d_model)</text>
  <g font-family="ui-monospace,monospace" font-size="12"><rect x="365" y="150" width="345" height="38" rx="7" fill="#f1f5f9"/><text x="383" y="174" fill="#64748b">row 0    [ · · · · · · · · ]</text><rect x="365" y="198" width="345" height="38" rx="7" fill="#f1f5f9"/><text x="383" y="222" fill="#64748b">row 1    [ · · · · · · · · ]</text><text x="537" y="260" text-anchor="middle" fill="#94a3b8">⋮</text><rect x="355" y="275" width="365" height="49" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="376" y="305" fill="#1e40af">row 2746 [ .18 −.42 .07 … ]</text><text x="537" y="350" text-anchor="middle" fill="#94a3b8">⋮ V rows</text></g>
  <rect x="865" y="142" width="260" height="84" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="995" y="174" text-anchor="middle" font-size="15" fill="#475569">embedding vector E[2746]</text><text x="995" y="204" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#4338ca">shape: d_model</text></g>
  <path d="M228 184H318" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M748 184H853" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="275" y="395" width="650" height="38" rx="19" fill="#e0e7ff"/><text x="600" y="420" text-anchor="middle" font-family="Inter,system-ui" font-size="14" fill="#3730a3">Every vocabulary item owns an independent trainable memory slot</text>
</svg>
