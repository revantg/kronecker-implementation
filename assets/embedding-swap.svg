<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">The architectural swap</title><desc id="desc">The normal vocabulary lookup and the Kronecker codec plus projection both produce the same model-width vectors for an unchanged transformer.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><filter id="s"><feDropShadow dy="7" stdDeviation="7" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="410" rx="26" fill="url(#bg)"/><text x="600" y="48" text-anchor="middle" font-family="Inter,system-ui" font-size="27" font-weight="750" fill="#0f172a">The paper changes one module, not the transformer</text>
  <g font-family="Inter,system-ui" filter="url(#s)"><text x="62" y="137" font-size="14" font-weight="800" fill="#1d4ed8">NORMAL</text><rect x="155" y="95" width="350" height="92" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="330" y="129" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">nn.Embedding(V, d_model)</text><text x="330" y="158" text-anchor="middle" font-size="13" fill="#475569">V × d_model learned values</text>
  <text x="62" y="277" font-size="14" font-weight="800" fill="#0e7490">KRON</text><rect x="155" y="225" width="170" height="105" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="240" y="265" text-anchor="middle" font-size="16" font-weight="700" fill="#155e75">fixed κ(bytes)</text><text x="240" y="293" text-anchor="middle" font-size="12" fill="#475569">0 learned values</text><rect x="355" y="225" width="190" height="105" rx="18" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/><text x="450" y="265" text-anchor="middle" font-size="16" font-weight="700" fill="#6b21a8">projection</text><text x="450" y="293" text-anchor="middle" font-size="12" fill="#475569">D × d_model values</text>
  <rect x="735" y="139" width="395" height="130" rx="22" fill="#fff" stroke="#a78bfa" stroke-width="2.5"/><text x="932" y="180" text-anchor="middle" font-size="18" font-weight="750" fill="#5b21b6">unchanged GPT transformer</text><text x="932" y="210" text-anchor="middle" font-size="13" fill="#475569">positions · attention · MLP · normalization</text><text x="932" y="239" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#7c3aed">expects B × T × d_model</text></g>
  <path d="M508 141C615 141 620 181 720 190" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M548 277C625 277 635 232 720 218" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M326 277H343" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <text x="625" y="351" text-anchor="middle" font-family="Inter,system-ui" font-size="14" fill="#475569">both paths hand the transformer identically shaped vectors</text>
</svg>
