<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Trainable input parameter comparison</title><desc id="desc">For the notebook configuration, the normal embedding has 3,216,448 parameters while the Kronecker projection has 262,144, a 91.8 percent reduction.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><linearGradient id="n" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><linearGradient id="k" x1="0" x2="1"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
  <rect width="1200" height="420" rx="26" fill="url(#bg)"/><text x="600" y="52" text-anchor="middle" font-family="Inter,system-ui" font-size="27" font-weight="750" fill="#0f172a">Trainable parameters in the input module</text><text x="600" y="81" text-anchor="middle" font-family="Inter,system-ui" font-size="14" fill="#64748b">GPT-2 vocabulary V = 50,257 · model width d_model = 64 · codec width D = 4,096</text>
  <g font-family="Inter,system-ui"><text x="238" y="158" text-anchor="end" font-size="15" font-weight="700" fill="#1e3a8a">normal lookup</text><rect x="265" y="122" width="800" height="58" rx="14" fill="#dbeafe"/><rect x="265" y="122" width="800" height="58" rx="14" fill="url(#n)"/><text x="290" y="158" font-size="15" font-weight="750" fill="#fff">3,216,448</text><text x="1083" y="158" font-size="13" fill="#475569">V × d_model</text>
  <text x="238" y="251" text-anchor="end" font-size="15" font-weight="700" fill="#155e75">Kron projection</text><rect x="265" y="215" width="800" height="58" rx="14" fill="#cffafe"/><rect x="265" y="215" width="65.2" height="58" rx="14" fill="url(#k)"/><text x="345" y="251" font-size="15" font-weight="750" fill="#0e7490">262,144</text><text x="1083" y="251" font-size="13" fill="#475569">D × d_model</text>
  <rect x="390" y="322" width="420" height="58" rx="19" fill="#ecfeff" stroke="#22d3ee"/><text x="600" y="347" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">91.8% fewer input parameters</text><text x="600" y="368" text-anchor="middle" font-size="12" fill="#475569">because D ≪ V in this configuration</text></g>
</svg>
