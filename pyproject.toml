[project]
name = "kronecker-implementation"
version = "0.1.0"
description = "Three-architecture comparison of BPE, Kronecker input, and raw-byte language models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.1.0",
    "marimo>=0.24.2",
    "safetensors>=0.7.0",
    "tokenizers>=0.22.0",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pydantic-ai>=2.43.0",
    "ruff>=0.16.7",
]
