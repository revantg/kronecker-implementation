[project]
name = "kronecker-implementation"
version = "0.1.0"
description = "An educational comparison of conventional and Kronecker token embeddings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "marimo>=0.24.2",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pydantic-ai>=2.43.0",
    "ruff>=0.16.7",
]
